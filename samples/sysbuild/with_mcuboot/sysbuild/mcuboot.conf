# Example of sample specific Kconfig changes when building sample with MCUboot
# when using sysbuild. Note that the MCUboot operating mode is not set here as
# sysbuild will automatically set it for both the application and MCUboot images itself
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_RSA_PSA=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_USB_DFU_WAIT=y

# How long MCUboot stays in DFU mode before timing out and booting the app
CONFIG_BOOT_USB_DFU_WAIT_DELAY_MS=5000

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Arduino Mezza Bootloader"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x017C

CONFIG_PWM=y
